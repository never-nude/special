<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title></title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{cursor:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
if (!gl) {
  document.body.style.cssText = 'display:flex;align-items:center;justify-content:center';
  document.body.innerHTML = '<p style="color:#555;font-family:system-ui">requires webgl</p>';
  throw '';
}

const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fragSrc = `
precision highp float;

uniform float u_time;
uniform float u_alt;
uniform vec2 u_mouse;
uniform vec2 u_res;

vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289(vec2 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+10.0)*x); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm5(vec2 p){
  float f = 0.0, w = 0.5;
  for(int i = 0; i < 5; i++){ f += w * snoise(p); p *= 2.0; w *= 0.5; }
  return f;
}

float fbm3(vec2 p){
  float f = 0.0, w = 0.5;
  for(int i = 0; i < 3; i++){ f += w * snoise(p); p *= 2.0; w *= 0.5; }
  return f;
}

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 st = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;

  float alt = u_alt;
  float t = u_time;

  // autonomous drift
  vec2 drift = vec2(
    sin(t * 0.1) * 0.012 + sin(t * 0.073) * 0.006,
    cos(t * 0.083) * 0.008 + sin(t * 0.131) * 0.004
  );
  st += u_mouse * 0.08 + drift;

  // horizon curves down with altitude
  float curve = alt * alt * 0.35;
  float hy = st.y + curve;

  // vertical gradient factor
  float vg = smoothstep(-0.6, 0.8, hy);

  // altitude blend weights
  float bFog   = 1.0 - smoothstep(0.0, 0.2, alt);
  float bLow   = smoothstep(0.0, 0.15, alt) * (1.0 - smoothstep(0.25, 0.5, alt));
  float bMid   = smoothstep(0.25, 0.45, alt) * (1.0 - smoothstep(0.6, 0.8, alt));
  float bHigh  = smoothstep(0.6, 0.75, alt) * (1.0 - smoothstep(0.85, 0.98, alt));
  float bSpace = smoothstep(0.85, 0.98, alt);

  // sky palettes per altitude band
  vec3 fogCol = vec3(0.76, 0.74, 0.71);

  vec3 sky = vec3(0.0);
  sky += bFog * fogCol;
  sky += bLow * mix(vec3(0.82, 0.78, 0.72), vec3(0.58, 0.68, 0.80), vg);
  sky += bMid * mix(vec3(0.88, 0.68, 0.42), vec3(0.28, 0.48, 0.78), vg);
  sky += bHigh * mix(vec3(0.18, 0.28, 0.52), vec3(0.06, 0.09, 0.22), vg);
  sky += bSpace * mix(vec3(0.04, 0.06, 0.14), vec3(0.02, 0.02, 0.06), vg);

  float bSum = bFog + bLow + bMid + bHigh + bSpace;
  sky /= max(bSum, 0.001);

  vec3 color = sky;

  // --- clouds ---
  float cloudDensity = 1.0 - smoothstep(0.0, 0.65, alt);

  vec2 cUV1 = st * 1.2 + vec2(t * 0.008, t * 0.004);
  float c1 = fbm5(cUV1) * 0.5 + 0.5;

  vec2 cUV2 = st * 2.5 + vec2(t * 0.012, -t * 0.006);
  float c2 = fbm3(cUV2) * 0.5 + 0.5;

  float clouds = c1 * 0.7 + c2 * 0.3;
  clouds = smoothstep(0.35, 0.75, clouds);

  // clouds shift below as you rise
  float cloudShift = alt * 1.8;
  float cloudBand = 1.0 - smoothstep(-0.1 - cloudShift, 0.4 - cloudShift, hy);
  cloudBand = mix(1.0, cloudBand, smoothstep(0.0, 0.15, alt));
  clouds *= cloudBand * cloudDensity;

  // cloud lighting
  vec3 cloudLit = vec3(0.96, 0.94, 0.91);
  vec3 cloudDark = vec3(0.68, 0.66, 0.64);
  float cloudLight = smoothstep(-0.2, 0.3, hy + cloudShift);
  vec3 cloudCol = mix(cloudDark, cloudLit, cloudLight);

  // golden tint at mid altitude
  float golden = smoothstep(0.25, 0.55, alt) * (1.0 - smoothstep(0.6, 0.9, alt));
  cloudCol = mix(cloudCol, vec3(1.0, 0.86, 0.62), golden * 0.25);

  color = mix(color, cloudCol, clouds * 0.85);

  // --- horizon glow ---
  float hGlow = exp(-hy * hy * 25.0);
  vec3 hColor = mix(
    mix(vec3(0.92, 0.87, 0.82), vec3(1.0, 0.72, 0.42), smoothstep(0.0, 0.4, alt)),
    vec3(0.42, 0.62, 1.0),
    smoothstep(0.5, 0.85, alt)
  );
  float hIntensity = (0.12 + 0.22 * smoothstep(0.15, 0.55, alt)) * (1.0 - smoothstep(0.88, 1.0, alt));
  color += hColor * hGlow * hIntensity;

  // --- stars ---
  float starVis = smoothstep(0.55, 0.92, alt);
  float starMask = smoothstep(-0.05, 0.25, hy);

  vec2 starUV = st * 120.0;
  vec2 starID = floor(starUV);
  vec2 starF = fract(starUV) - 0.5;
  float h1 = hash(starID);
  float starBright = 0.0;
  if(h1 > 0.97){
    vec2 sp = vec2(hash(starID + 0.1) - 0.5, hash(starID + 0.2) - 0.5);
    float d = length(starF - sp);
    starBright = smoothstep(0.04, 0.0, d);
    starBright *= 0.6 + 0.4 * sin(t * (0.5 + h1 * 2.0) + h1 * 100.0);
  }
  // second layer, dimmer
  vec2 s2UV = st * 250.0;
  vec2 s2ID = floor(s2UV);
  vec2 s2F = fract(s2UV) - 0.5;
  float h2 = hash(s2ID + vec2(71.0, 37.0));
  if(h2 > 0.985){
    vec2 sp2 = vec2(hash(s2ID + 3.1) - 0.5, hash(s2ID + 5.2) - 0.5);
    float d2 = length(s2F - sp2);
    starBright += smoothstep(0.025, 0.0, d2) * 0.4;
  }

  color += vec3(0.92, 0.94, 1.0) * starBright * starVis * starMask;

  // --- earth from above ---
  float earthVis = smoothstep(0.72, 0.95, alt);
  if(hy < 0.0 && earthVis > 0.0){
    vec3 earthCol = vec3(0.12, 0.25, 0.45);
    float topClouds = fbm3(st * 3.0 + vec2(t * 0.004, t * 0.002)) * 0.5 + 0.5;
    topClouds = smoothstep(0.3, 0.7, topClouds);
    earthCol = mix(earthCol, vec3(0.82, 0.84, 0.87), topClouds * 0.5);
    float belowH = smoothstep(0.0, -0.4, hy);
    color = mix(color, earthCol, belowH * earthVis);
  }

  // earth rim glow
  float rimGlow = exp(-pow(hy + 0.01, 2.0) * 150.0) * earthVis;
  color += vec3(0.35, 0.55, 0.85) * rimGlow * 0.35;

  // --- atmospheric scatter haze ---
  float scatter = smoothstep(0.3, 0.65, alt) * (1.0 - smoothstep(0.8, 1.0, alt));
  float scatterShape = exp(-hy * hy * 6.0);
  color += vec3(0.22, 0.35, 0.55) * scatter * scatterShape * 0.08;

  // --- low altitude mist particles ---
  float mistVis = 1.0 - smoothstep(0.0, 0.2, alt);
  float mist = snoise(st * 8.0 + vec2(t * 0.03, t * 0.02)) * 0.5 + 0.5;
  mist *= snoise(st * 15.0 + vec2(-t * 0.02, t * 0.04)) * 0.5 + 0.5;
  color += vec3(0.85, 0.83, 0.80) * mist * mistVis * 0.08;

  // --- post ---
  // vignette
  vec2 vc = uv - 0.5;
  float vig = 1.0 - dot(vc, vc) * 0.6;
  vig = smoothstep(0.0, 1.0, vig);
  color *= vig;

  // chromatic warmth at edges
  float r2 = dot(vc, vc);
  color.r *= 1.0 + r2 * 0.08;
  color.b *= 1.0 - r2 * 0.04;

  // breathing pulse
  float pulse = sin(t * 0.25) * 0.015 + sin(t * 0.17) * 0.008;
  color *= 1.0 + pulse;

  // temperature shift with altitude
  color += vec3(0.02, 0.01, 0.0) * (1.0 - alt);
  color += vec3(0.0, 0.0, 0.01) * alt;

  color = pow(color, vec3(0.95));

  gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}
`;

// compile
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

// fullscreen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const loc = {
  time: gl.getUniformLocation(prog, 'u_time'),
  alt: gl.getUniformLocation(prog, 'u_alt'),
  mouse: gl.getUniformLocation(prog, 'u_mouse'),
  res: gl.getUniformLocation(prog, 'u_res')
};

// state
const S = {
  alt: 0, targetAlt: 0,
  mx: 0, my: 0, sx: 0, sy: 0,
  time: 0, last: 0
};

// resize
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

// mouse
addEventListener('mousemove', e => {
  S.mx = (e.clientX / innerWidth) * 2 - 1;
  S.my = -((e.clientY / innerHeight) * 2 - 1);
});

// touch look
addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    S.mx = (e.touches[0].clientX / innerWidth) * 2 - 1;
    S.my = -((e.touches[0].clientY / innerHeight) * 2 - 1);
  }
}, { passive: true });

// scroll for altitude
addEventListener('wheel', e => {
  e.preventDefault();
  S.targetAlt += e.deltaY * 0.0004;
  S.targetAlt = Math.max(0, Math.min(1, S.targetAlt));
}, { passive: false });

// touch scroll (two-finger or single drag for altitude)
let touchY0 = 0;
addEventListener('touchstart', e => { touchY0 = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => {
  const dy = touchY0 - e.touches[0].clientY;
  touchY0 = e.touches[0].clientY;
  S.targetAlt += dy * 0.0015;
  S.targetAlt = Math.max(0, Math.min(1, S.targetAlt));
}, { passive: true });

// render
function frame(now) {
  if (!S.last) S.last = now;
  const dt = Math.min((now - S.last) / 1000, 0.1);
  S.last = now;
  S.time += dt;

  // smooth altitude (exponential ease)
  S.alt += (S.targetAlt - S.alt) * (1 - Math.exp(-2.2 * dt));

  // smooth mouse (very heavy)
  const mLerp = 1 - Math.exp(-0.9 * dt);
  S.sx += (S.mx - S.sx) * mLerp;
  S.sy += (S.my - S.sy) * mLerp;

  gl.uniform1f(loc.time, S.time);
  gl.uniform1f(loc.alt, S.alt);
  gl.uniform2f(loc.mouse, S.sx, S.sy);
  gl.uniform2f(loc.res, canvas.width, canvas.height);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
